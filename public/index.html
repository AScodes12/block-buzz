<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlockBuzz - Secure Scratch Community</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* --- CHROME MATERIAL UI (DEFAULT) --- */
        :root {
            --bg-color: #f1f3f4; 
            --card-bg: #ffffff; 
            --border-color: #dadce0;
            --text-primary: #202124; 
            --text-secondary: #5f6368;
            --accent-color: #1a73e8; 
            --accent-hover: #1b66c9;
            --radius-md: 12px; 
            --radius-lg: 16px;
            --shadow-sm: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
            --shadow-hover: 0 1px 3px 0 rgba(60,64,67,0.3), 0 4px 8px 3px rgba(60,64,67,0.15);
            --font-family: 'Roboto', Arial, sans-serif;
        }

        /* --- LEGACY UI VARIABLES --- */
        body.legacy-theme {
            --bg-color: #f1f5f9; --card-bg: #ffffff; --border-color: #e2e8f0;
            --text-primary: #0f172a; --text-secondary: #64748b;
            --accent-color: #2563eb; --accent-hover: #1d4ed8;
            --radius-md: 8px; --radius-lg: 12px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-hover: 0 1px 3px rgba(0,0,0,0.05);
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-family); }
        body { background-color: var(--bg-color); color: var(--text-primary); line-height: 1.5; padding-bottom: 60px; }

        /* HEADER: One Row */
        header { position: sticky; top: 0; z-index: 100; background: #ffffff; border-bottom: 1px solid var(--border-color); box-shadow: 0 1px 2px 0 rgba(60,64,67,0.1); }
        .header-container { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; flex-wrap: nowrap; gap: 24px; }
        .logo { font-weight: 700; font-size: 1.3rem; cursor: pointer; color: var(--text-primary); letter-spacing: -0.2px; white-space: nowrap; }
        
        nav { display: flex; gap: 4px; overflow-x: auto; white-space: nowrap; flex: 1; align-items: center; scrollbar-width: none; }
        nav::-webkit-scrollbar { display: none; } 
        
        .nav-link { padding: 8px 16px; border-radius: 99px; font-weight: 500; font-size: 14px; color: var(--text-secondary); background: none; border: none; cursor: pointer; transition: background-color 0.2s, color 0.2s; }
        .nav-link:hover { background-color: #f1f3f4; color: var(--text-primary); }
        .nav-link.active { color: #1a73e8; background-color: #e8f0fe; }

        #auth-container { display: flex; align-items: center; gap: 12px; white-space: nowrap; flex-shrink: 0; }

        main { max-width: 760px; margin: 24px auto; padding: 0 16px; }
        .tab-content { display: none; }

        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow-sm); transition: box-shadow 0.2s; }
        .card:hover { box-shadow: var(--shadow-hover); }
        body.legacy-theme .card { border-radius: 0; box-shadow: none; border: 1px solid #cbd5e1; }
        
        .input-group { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
        input[type="text"], input[type="password"], select, textarea { width: 100%; padding: 10px 14px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; outline: none; transition: border-color 0.2s; background: #fff; }
        input[type="text"]:focus, input[type="password"]:focus, select:focus, textarea:focus { border: 2px solid var(--accent-color); padding: 9px 13px; }
        textarea { resize: vertical; min-height: 80px; }

        .btn { background-color: var(--accent-color); color: #fff; border: none; padding: 10px 24px; border-radius: 99px; font-weight: 500; font-size: 14px; cursor: pointer; transition: background-color 0.2s; }
        .btn:hover { background-color: var(--accent-hover); box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3); }
        
        .btn-outline { background-color: transparent; color: var(--accent-color); border: 1px solid var(--border-color); padding: 9px 23px; border-radius: 99px; font-weight: 500; font-size: 14px; cursor: pointer; transition: background-color 0.2s; }
        .btn-outline:hover { background-color: #f8f9fa; border-color: var(--border-color); color: var(--accent-hover); }

        .avatar-wrapper { width: 40px; height: 40px; border-radius: 50%; overflow: hidden; background: #e8eaed; flex-shrink: 0; }
        .avatar-wrapper img { width: 100%; height: 100%; object-fit: cover; }

        .project-thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 8px; margin: 12px 0; border: 1px solid var(--border-color); }
        
        .post-stats { display: flex; gap: 20px; margin-top: 12px; font-size: 13px; color: var(--text-secondary); border-top: 1px solid #f1f3f4; padding-top: 12px; align-items: center; }
        .stat-btn { background: none; border: none; cursor: pointer; color: var(--text-secondary); font-size: 13px; display: flex; align-items: center; gap: 6px; transition: color 0.2s; padding: 4px 8px; border-radius: 4px; }
        .stat-btn:hover { background: #f1f3f4; color: var(--accent-color); }

        .comments-section { margin-top: 12px; border-top: 1px dashed var(--border-color); padding-top: 12px; display: none; }
        .comments-section.open { display: block; }
        .comment-item { font-size: 13px; margin-bottom: 8px; background: #f8f9fa; padding: 8px 12px; border-radius: 8px; }
        .comment-input-row { display: flex; gap: 8px; margin-top: 8px; }

        .inline-msg { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-top: 8px; display: none; }
        .inline-msg.error { background: #fce8e6; color: #c5221f; border: 1px solid #fad2cf; }
        .inline-msg.success { background: #e6f4ea; color: #137333; border: 1px solid #ceead6; }

        .clickable-user { font-weight: 500; font-size: 14px; color: var(--text-primary); cursor: pointer; text-decoration: none; }
        .clickable-user:hover { color: var(--accent-color); text-decoration: underline; }

        .discussions-tab-bar { display: flex; gap: 8px; margin-bottom: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
        .disc-tab-btn { padding: 8px 16px; border-radius: 99px; font-weight: 500; font-size: 14px; color: var(--text-secondary); background: transparent; border: 1px solid transparent; cursor: pointer; }
        .disc-tab-btn.active { background: #e8f0fe; color: #1a73e8; }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(32, 33, 36, 0.6); display: none; justify-content: center; align-items: center; z-index: 200; }
        .modal-card { background: #fff; border-radius: 16px; width: 100%; max-width: 400px; padding: 24px; position: relative; box-shadow: 0 11px 15px -7px rgba(0,0,0,0.2), 0 24px 38px 3px rgba(0,0,0,0.14); }
        .modal-close { position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 18px; font-weight: bold; cursor: pointer; color: var(--text-secondary); }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="logo" onclick="switchTab('home')">BlockBuzz</div>
            <nav>
                <button class="nav-link active" id="nav-home" onclick="switchTab('home')">Home</button>
                <button class="nav-link" id="nav-discussions" onclick="switchTab('discussions')">Discussions</button>
                <button class="nav-link" id="nav-store" onclick="switchTab('store')">Store</button>
                <button class="nav-link" id="nav-contests" onclick="switchTab('contests')">Contests</button>
                <button class="nav-link" id="nav-studios" onclick="switchTab('studios')">Studios</button>
                <button class="nav-link" id="nav-settings" onclick="switchTab('settings')">Settings</button>
            </nav>
            <div id="auth-container"></div>
        </div>
    </header>

    <main>
        <!-- HOME SECTION -->
        <section id="home-section" class="tab-content" style="display: block;">
            <div class="card" id="create-post-card">
                <h3 style="margin-bottom: 4px; font-size: 16px;">Share a Scratch Project</h3>
                <p style="color:var(--text-secondary); font-size: 13px;">Paste your project link to showcase it.</p>
                <div class="input-group">
                    <input type="text" id="scratch-input" placeholder="Scratch Project URL or ID">
                    <textarea id="post-caption" placeholder="Write a short caption"></textarea>
                    <div style="text-align: right;"><button onclick="submitPost()" class="btn">Post Project</button></div>
                    <div id="home-msg" class="inline-msg"></div>
                </div>
            </div>
            <div id="feed"></div>
        </section>

        <!-- DISCUSSIONS SECTION -->
        <section id="discussions-section" class="tab-content">
            <div class="card">
                <h3 style="margin-bottom: 4px; font-size: 16px;">Start a Discussion</h3>
                <div class="input-group">
                    <input type="text" id="discussion-title" placeholder="Discussion Title">
                    <select id="discussion-category">
                        <option value="scratch">Scratch Topics</option>
                        <option value="feedback">BlockBuzz Feedback</option>
                    </select>
                    <textarea id="discussion-content" placeholder="What would you like to discuss?"></textarea>
                    <div style="text-align: right;"><button onclick="submitDiscussion()" class="btn">Post Discussion</button></div>
                    <div id="discussion-msg" class="inline-msg"></div>
                </div>
            </div>
            <div class="discussions-tab-bar">
                <button class="disc-tab-btn active" id="disc-tab-scratch" onclick="switchDiscussionCategory('scratch')">Scratch Topics</button>
                <button class="disc-tab-btn" id="disc-tab-feedback" onclick="switchDiscussionCategory('feedback')">BlockBuzz Feedback</button>
            </div>
            <div id="discussions-feed"></div>
        </section>

        <!-- STORE SECTION -->
        <section id="store-section" class="tab-content">
            <div class="card">
                <h2 style="font-size: 20px; margin-bottom: 8px;">Cosmetic Store</h2>
                <p style="color:var(--text-secondary); font-size: 14px; margin-bottom: 16px;">Customize your profile appearance.</p>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px;">
                    <button class="btn-outline">Blue Theme</button>
                    <button class="btn-outline">Red Theme</button>
                    <button class="btn-outline">Green Theme</button>
                </div>
            </div>
        </section>

        <!-- CONTESTS SECTION -->
        <section id="contests-section" class="tab-content">
            <div class="card">
                <h3 style="margin-bottom: 4px; font-size: 16px;">Promote a Contest</h3>
                <div class="input-group">
                    <input type="text" id="contest-input" placeholder="Contest URL">
                    <textarea id="contest-desc" placeholder="Describe the rules and prizes..."></textarea>
                    <div style="text-align: right;"><button onclick="submitContest()" class="btn">Post Contest</button></div>
                    <div id="contest-msg" class="inline-msg"></div>
                </div>
            </div>
            <div id="contests-feed"></div>
        </section>

        <!-- STUDIOS SECTION -->
        <section id="studios-section" class="tab-content">
            <div class="card">
                <h3 style="margin-bottom: 4px; font-size: 16px;">Promote a Studio</h3>
                <div class="input-group">
                    <input type="text" id="studio-title" placeholder="Studio Name">
                    <input type="text" id="studio-link" placeholder="Studio Link">
                    <textarea id="studio-desc" placeholder="Studio Description"></textarea>
                    <div style="text-align: right;"><button onclick="submitStudio()" class="btn">Post Studio</button></div>
                    <div id="studio-msg" class="inline-msg"></div>
                </div>
            </div>
            <div id="studios-feed"></div>
        </section>
        
        <!-- NOTIFICATIONS SECTION -->
        <section id="notifications-section" class="tab-content"></section>

        <!-- CURRENT USER PROFILE -->
        <section id="account-section" class="tab-content">
            <div id="account-profile-content"></div>
        </section>

        <!-- VIEW SPECIFIC USER PROFILE SECTION -->
        <section id="user-profile-section" class="tab-content">
            <div id="user-profile-content"></div>
        </section>

        <!-- SETTINGS SECTION -->
        <section id="settings-section" class="tab-content">
            <div class="card">
                <h2 style="font-size: 18px; margin-bottom: 16px;">Settings</h2>
                <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px;">
                    <div>
                        <h4 style="font-size: 14px; color: var(--text-primary);">Legacy Interface</h4>
                        <p style="font-size: 13px; color: var(--text-secondary);">Revert to old visual style.</p>
                    </div>
                    <button class="btn-outline" id="theme-toggle-btn" onclick="toggleTheme()">Enable Legacy UI</button>
                </div>
            </div>
        </section>
    </main>

    <!-- AUTH MODAL -->
    <div id="auth-modal" class="modal-overlay">
        <div class="modal-card">
            <button class="modal-close" onclick="closeAuthModal()">✕</button>
            <h3 style="margin-bottom: 20px; font-size: 18px;">Sign in</h3>
            <div class="input-group">
                <input type="text" id="login-username" placeholder="Username">
                <input type="password" id="login-password" placeholder="Password">
                <button class="btn" onclick="submitLogin()" style="width: 100%; margin-top: 8px;">Next</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
