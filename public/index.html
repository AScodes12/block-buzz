<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Buzz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NAVIGATION BAR -->
    <nav class="navbar">
        <div class="nav-brand">Block Buzz</div>
        <div class="nav-links">
            <button class="nav-btn active" data-target="feed-page">Feed</button>
            <button class="nav-btn" data-target="discussions-page">Discussions</button>
            <button class="nav-btn" data-target="contests-page">Contests</button>
            <button class="nav-btn" data-target="studios-page">Studios</button>
        </div>
        <div class="nav-user" id="user-nav-container">
            <!-- User info or Login/Register buttons will be injected here -->
        </div>
    </nav>

    <!-- MAIN CONTAINER -->
    <main class="container">

        <!-- FEED PAGE (DEFAULT) -->
        <section id="feed-page" class="page-section active">
            <div class="section-header">
                <h2>Project Feed</h2>
                <button class="btn btn-primary" id="btn-open-create-post">Share Project</button>
            </div>
            <div class="feed-grid" id="posts-container">
                <!-- Posts dynamic insertion -->
            </div>
        </section>

        <!-- DISCUSSIONS PAGE -->
        <section id="discussions-page" class="page-section">
            <div class="section-header">
                <h2>Community Discussions</h2>
                <button class="btn btn-primary" id="btn-open-create-discussion">Start Discussion</button>
            </div>
            
            <!-- Category Tabs -->
            <div class="tab-bar">
                <button class="tab-btn active" data-category="scratch">Scratch Topics</button>
                <button class="tab-btn" data-category="feedback">Block Buzz Feedback</button>
            </div>

            <div class="discussions-list" id="discussions-container">
                <!-- Discussions dynamic insertion -->
            </div>
        </section>

        <!-- CONTESTS PAGE -->
        <section id="contests-page" class="page-section">
            <div class="section-header">
                <h2>Contests</h2>
                <button class="btn btn-primary" id="btn-open-create-contest">Host Contest</button>
            </div>
            <div id="contests-container" class="cards-grid">
                <!-- Contests dynamic insertion -->
            </div>
        </section>

        <!-- STUDIOS PAGE -->
        <section id="studios-page" class="page-section">
            <div class="section-header">
                <h2>Studios</h2>
                <button class="btn btn-primary" id="btn-open-create-studio">Add Studio</button>
            </div>
            <div id="studios-container" class="cards-grid">
                <!-- Studios dynamic insertion -->
            </div>
        </section>

        <!-- USER PROFILE PAGE -->
        <section id="profile-page" class="page-section">
            <div id="profile-details-container">
                <!-- Profile information dynamic insertion -->
            </div>
            <h3 class="section-subtitle">User Projects</h3>
            <div class="feed-grid" id="user-posts-container">
                <!-- User posts insertion -->
            </div>
        </section>

    </main>

    <!-- CREATE DISCUSSION MODAL -->
    <div class="modal" id="modal-create-discussion">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h3>Start a Discussion</h3>
            <form id="form-create-discussion">
                <label for="discussion-title">Title</label>
                <input type="text" id="discussion-title" required placeholder="What's on your mind?">

                <label for="discussion-category">Category</label>
                <select id="discussion-category" required>
                    <option value="scratch">Scratch Topics</option>
                    <option value="feedback">Block Buzz Feedback</option>
                </select>

                <label for="discussion-content">Details</label>
                <textarea id="discussion-content" rows="4" required placeholder="Write your post here..."></textarea>

                <button type="submit" class="btn btn-primary btn-full">Post Discussion</button>
            </form>
        </div>
    </div>

    <!-- EXISTING MODALS (CREATE POST, CONTEST, STUDIO, AUTH, RESET PASSWORD, ETC.) -->
    <div class="modal" id="modal-create-post">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h3>Share Scratch Project</h3>
            <form id="form-create-post">
                <label for="post-scratch-input">Scratch Project Link or ID</label>
                <input type="text" id="post-scratch-input" required placeholder="e.g. https://scratch.mit.edu/projects/123456789">

                <label for="post-caption">Caption</label>
                <textarea id="post-caption" rows="3" placeholder="Tell us about your project..."></textarea>

                <button type="submit" class="btn btn-primary btn-full">Post</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
