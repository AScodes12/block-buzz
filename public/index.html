<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlockBuzz</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <nav>
        <a href="/" class="logo">BlockBuzz</a>
        <ul class="nav-links">
            <li><a href="/" class="active">Home</a></li>
            <li><a href="/store">Store</a></li>
            <li><a href="/contests">Contests</a></li>
            <li><a href="/studios">Studios</a></li>
            <li><a href="/profile">Profile</a></li>
        </ul>
        <a href="/login" class="btn">Login / Sign Up</a>
    </nav>

    <div class="container">
        <!-- Share Project Card -->
        <div class="card">
            <h2>Share a Scratch Project</h2>
            <p>Paste your project link to showcase it to the community.</p>
            <br>
            <input type="text" placeholder="Paste Scratch Project URL or ID..." id="scratch-input">
            <br><br>
            <!-- Explicit inline style added here to forcefully override browser defaults -->
            <textarea id="caption-input" placeholder="Write a short caption..." style="resize: none !important;"></textarea>
            <br>
            <button id="post-btn">Post Project</button>
        </div>

        <div id="posts-feed">
            <!-- Dynamic Posts Feed -->
        </div>
    </div>
</body>
</html>
