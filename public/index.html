<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlockBuzz - Secure Scratch Community</title>
    <style>
        /* --- REFINED MODERN UI VARIABLES (DEFAULT) --- */
        :root {
            --bg-color: #f4f7f9; 
            --card-bg: #ffffff; 
            --border-color: #e5e7eb;
            --text-primary: #111827; 
            --text-secondary: #6b7280;
            --accent-color: #4f46e5; 
            --accent-hover: #4338ca;
            --radius-md: 12px; 
            --radius-lg: 20px;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-hover: 0 12px 24px -4px rgba(0, 0, 0, 0.08);
            --font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* --- LEGACY UI VARIABLES --- */
        body.legacy-theme {
            --bg-color: #f1f5f9; --card-bg: #ffffff; --border-color: #e2e8f0;
            --text-primary: #0f172a; --text-secondary: #64748b;
            --accent-color: #2563eb; --accent-hover: #1d4ed8;
            --radius-md: 8px; --radius-lg: 12px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-hover: 0 1px 3px rgba(0,0,0,0.05);
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-family); }
        body { background-color: var(--bg-color); color: var(--text-primary); line-height: 1.6; padding-bottom: 60px; transition: background-color 0.3s ease; }

        /* HEADER: Strictly One Row */
        header { position: sticky; top: 0; z-index: 100; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-color); }
        body.legacy-theme header { background: #ffffff; border-bottom: 2px solid var(--accent-color); box-shadow: none; }
        
        .header-container { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; flex-wrap: nowrap; gap: 16px; }
        .logo { font-weight: 800; font-size: 1.4rem; cursor: pointer; color: var(--accent-color); letter-spacing: -0.5px; white-space: nowrap; }
        
        nav { display: flex; gap: 4px; overflow-x: auto; white-space: nowrap; flex: 1; align-items: center; scrollbar-width: none; }
        nav::-webkit-scrollbar { display: none; } /* Hide scrollbar for clean single row */
        
        .nav-link { padding: 8px 16px; border-radius: 99px; font-weight: 600; font-size: 14px; color: var(--text-secondary); background: none; border: none; cursor: pointer; transition: all 0.2s ease; }
        .nav-link:hover { color: var(--accent-color); background-color: #f3f4f6; }
        .nav-link.active { color: #fff; background-color: var(--accent-color); }
        
        body.legacy-theme .nav-link { border-radius: 4px; padding: 8px 12px; }
        body.legacy-theme .nav-link.active { color: #fff; background-color: var(--accent-color); }

        #auth-container { display: flex; align-items: center; gap: 12px; white-space: nowrap; flex-shrink: 0; }

        main { max-width: 760px; margin: 32px auto; padding: 0 16px; }
        .tab-content { display: none; }

        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 24px; margin-bottom: 24px; box-shadow: var(--shadow-sm); transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .card:hover { box-shadow: var(--shadow-hover); }
        body.legacy-theme .card { border-radius: 0; border: 1px solid #cbd5e1; }
        body.legacy-theme .card:hover { box-shadow: none; transform: none; }
        
        .input-group { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
        input[type="text"], input[type="password"], select, textarea { width: 100%; padding: 12px 16px; border: 1.5px solid var(--border-color); border-radius: var(--radius-md); font-size: 15px; outline: none; background: #fafafa; transition: border-color 0.2s; }
        input[type="text"]:focus, input[type="password"]:focus, select:focus, textarea:focus { border-color: var(--accent-color); background: #fff; }
        body.legacy-theme input[type="text"], body.legacy-theme textarea { border: 1px solid #94a3b8; border-radius: 4px; }

        textarea { resize: vertical; min-height: 80px; }

        .btn { background-color: var(--accent-color); color: #fff; border: none; padding: 10px 20px; border-radius: 99px; font-weight: 600; font-size: 14px; cursor: pointer; transition: background-color 0.2s ease; }
        .btn:hover { background-color: var(--accent-hover); }
        body.legacy-theme .btn { border-radius: 4px; }
        
        .btn-outline { background-color: transparent; color: var(--accent-color); border: 1.5px solid var(--accent-color); padding: 10px 20px; border-radius: 99px; font-weight: 600; font-size: 14px; cursor: pointer; transition: all 0.2s; text-decoration: none; display: inline-block; }
        .btn-outline:hover { background-color: var(--accent-color); color: #fff; }
        body.legacy-theme .btn-outline { border-radius: 4px; }

        .avatar-wrapper { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; background: #e5e7eb; border: 2px solid #fff; box-shadow: var(--shadow-sm); flex-shrink: 0; }
        .avatar-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        body.legacy-theme .avatar-wrapper { border: 1px solid #94a3b8; box-shadow: none; border-radius: 4px; }

        .project-thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: var(--radius-md); margin: 16px 0; border: 1px solid var(--border-color); }
        
        .post-stats { display: flex; gap: 16px; margin-top: 12px; font-size: 13px; font-weight: 600; color: var(--text-secondary); border-top: 1px solid var(--border-color); padding-top: 12px; }
        .stat-item { display: flex; align-items: center; gap: 6px; }

        .inline-msg { padding: 12px 16px; border-radius: var(--radius-md); font-size: 14px; margin-top: 12px; display: none; font-weight: 500; }
        .inline-msg.error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
        .inline-msg.success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }

        .clickable-user { font-weight: 600; font-size: 15px; color: var(--text-primary); cursor: pointer; transition: color 0.2s; text-decoration: none; }
        .clickable-user:hover { color: var(--accent-color); text-decoration: underline; }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(17, 24, 39, 0.6); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 200; }
        .modal-card { background: #fff; border-radius: var(--radius-lg); width: 100%; max-width: 400px; padding: 32px; position: relative; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); }
        .modal-close { position: absolute; top: 16px; right: 16px; background: none; border: none; font-size: 18px; font-weight: bold; cursor: pointer; color: var(--text-secondary); }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="logo" onclick="switchTab('home')">BlockBuzz</div>
            <nav>
                <button class="nav-link active" id="nav-home" onclick="switchTab('home')">Home</button>
                <button class="nav-link" id="nav-discussions" onclick="switchTab('discussions')">Discussions</button>
                <button class="nav-link" id="nav-store" onclick="switchTab('store')">Store</button>
                <button class="nav-link" id="nav-contests" onclick="switchTab('contests')">Contests</button>
                <button class="nav-link" id="nav-studios" onclick="switchTab('studios')">Studios</button>
                <button class="nav-link" id="nav-settings" onclick="switchTab('settings')">Settings</button>
            </nav>
            <div id="auth-container"></div>
        </div>
    </header>

    <main>
        <!-- HOME SECTION -->
        <section id="home-section" class="tab-content" style="display: block;">
            <div class="card" id="create-post-card">
                <h3 style="margin-bottom: 4px;">Share a Scratch Project</h3>
                <p style="color:var(--text-secondary); font-size: 14px;">Paste your project link to showcase it to the community.</p>
                <div class="input-group">
                    <input type="text" id="scratch-input" placeholder="Scratch Project URL or ID...">
                    <textarea id="post-caption" placeholder="Write a short caption..."></textarea>
                    <div style="text-align: right;"><button onclick="submitPost()" class="btn">Post Project</button></div>
                    <div id="home-msg" class="inline-msg"></div>
                </div>
            </div>
            <div id="feed"></div>
        </section>

        <!-- OTHER SECTIONS (DISCUSSIONS, STORE, CONTESTS, STUDIOS, NOTIFICATIONS) REMAIN UNCHANGED STRUCTURALLY -->
        <section id="discussions-section" class="tab-content"><div id="discussions-feed"></div></section>
        <section id="store-section" class="tab-content"><div class="card"><h2>Store is currently disabled.</h2></div></section>
        <section id="contests-section" class="tab-content"><div id="contests-feed"></div></section>
        <section id="studios-section" class="tab-content"><div id="studios-feed"></div></section>
        <section id="notifications-section" class="tab-content"></section>

        <!-- CURRENT USER PROFILE -->
        <section id="account-section" class="tab-content">
            <div id="account-profile-content"></div>
        </section>

        <!-- VIEW SPECIFIC USER PROFILE SECTION -->
        <section id="user-profile-section" class="tab-content">
            <div id="user-profile-content"></div>
        </section>

        <!-- SETTINGS SECTION -->
        <section id="settings-section" class="tab-content">
            <div class="card">
                <h2 style="margin-bottom: 16px;">Preferences</h2>
                <div style="display: flex; justify-content: space-between; align-items: center; padding: 16px; background: #fafafa; border: 1px solid var(--border-color); border-radius: var(--radius-md);">
                    <div>
                        <h4 style="font-size: 15px; color: var(--text-primary);">Legacy UI</h4>
                        <p style="font-size: 13px; color: var(--text-secondary); margin-top: 4px;">Revert to the old BlockBuzz appearance.</p>
                    </div>
                    <button class="btn-outline" id="theme-toggle-btn" onclick="toggleTheme()">Enable Legacy UI</button>
                </div>
            </div>
        </section>
    </main>

    <!-- AUTH MODAL -->
    <div id="auth-modal" class="modal-overlay">
        <div class="modal-card">
            <button class="modal-close" onclick="closeAuthModal()">X</button>
            <div id="login-form-container">
                <h3 style="margin-bottom: 24px; font-size: 1.25rem;">Log In</h3>
                <div class="input-group">
                    <input type="text" id="login-username" placeholder="Username">
                    <input type="password" id="login-password" placeholder="Password">
                    <button class="btn" onclick="submitLogin()" style="width: 100%;">Log In</button>
                    <div id="login-msg" class="inline-msg"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
