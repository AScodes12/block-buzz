<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">Admin Panel</div>
        <div class="nav-links">
            <a href="index.html">Back to App</a>
        </div>
    </nav>

    <main class="container">
        <h1>Admin Dashboard</h1>
        <p>Warning: Authorized users only.</p>
        
        <div class="admin-controls">
            <h2>Delete a Post</h2>
            <input type="text" id="delete-post-id" placeholder="Enter Post ID">
            <button onclick="adminDeletePost()">Delete Post</button>
            
            <h2>Give Coins to User</h2>
            <input type="text" id="reward-username" placeholder="Username">
            <input type="number" id="reward-amount" placeholder="Amount">
            <button onclick="adminGiveCoins()">Send Coins</button>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
