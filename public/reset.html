<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Scratch Platform</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background: var(--bg-primary);">

    <div class="card" style="max-width: 400px; width: 100%; margin: 20px;">
        <h2 style="margin-bottom: 8px;">Reset Password</h2>
        <p style="color: var(--text-secondary); margin-bottom: 16px; font-size: 13px;">
            Enter your verified Scratch username to request a password reset code.
        </p>

        <!-- STEP 1: REQUEST RESET -->
        <div id="reset-request-form" class="input-group">
            <input type="text" id="reset-username" placeholder="Scratch Username">
            <button onclick="requestPasswordReset()" class="btn" style="width: 100%;">Get Reset Code</button>
            <div id="reset-msg-1" class="inline-msg" style="display: none; margin-top: 10px;"></div>
        </div>

        <!-- STEP 2: SUBMIT CODE & NEW PASSWORD -->
        <div id="reset-confirm-form" class="input-group" style="display: none;">
            <p style="color: var(--text-secondary); margin-bottom: 12px; font-size: 13px;">
                Paste this code on the top line of your Scratch profile's <strong>"What I'm working on"</strong> section, then enter your new password below:
            </p>
            <div style="background: var(--bg-secondary); padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); text-align: center; margin-bottom: 12px;">
                <strong id="reset-code-display" style="font-size: 16px; color: var(--accent-color);">---</strong>
            </div>
            <input type="password" id="new-password" placeholder="New Password">
            <button onclick="confirmPasswordReset()" class="btn" style="width: 100%;">Update Password</button>
            <div id="reset-msg-2" class="inline-msg" style="display: none; margin-top: 10px;"></div>
        </div>

        <div style="text-align: center; margin-top: 16px;">
            <a href="index.html" style="font-size: 13px; color: var(--accent-color); text-decoration: none;">← Back to Main App</a>
        </div>
    </div>

    <script>
        let resetUsernameValue = '';

        async function requestPasswordReset() {
            const usernameInput = document.getElementById('reset-username');
            const msg = document.getElementById('reset-msg-1');
            const username = usernameInput ? usernameInput.value.trim() : '';

            if (!username) {
                return showMsg(msg, 'Please enter your username.', 'error');
            }

            try {
                const res = await fetch('/api/auth/reset-request', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username })
                });
                const data = await res.json();

                if (res.ok) {
                    resetUsernameValue = username;
                    document.getElementById('reset-request-form').style.display = 'none';
                    document.getElementById('reset-confirm-form').style.display = 'block';
                    document.getElementById('reset-code-display').textContent = data.verificationCode;
                } else {
                    showMsg(msg, data.error, 'error');
                }
            } catch (err) {
                showMsg(msg, 'Failed to request password reset.', 'error');
            }
        }

        async function confirmPasswordReset() {
            const passwordInput = document.getElementById('new-password');
            const msg = document.getElementById('reset-msg-2');
            const newPassword = passwordInput ? passwordInput.value : '';

            if (!newPassword) {
                return showMsg(msg, 'Please enter a new password.', 'error');
            }

            try {
                const res = await fetch('/api/auth/reset-confirm', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: resetUsernameValue, newPassword })
                });
                const data = await res.json();

                if (res.ok) {
                    showMsg(msg, 'Password updated successfully! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                } else {
                    showMsg(msg, data.error, 'error');
                }
            } catch (err) {
                showMsg(msg, 'Password reset confirmation failed.', 'error');
            }
        }

        function showMsg(el, text, type) {
            if (!el) return;
            el.textContent = text;
            el.className = `inline-msg ${type}`;
            el.style.display = 'block';
        }
    </script>
</body>
</html>
