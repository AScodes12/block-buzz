<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlockBuzz</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <h1>BlockBuzz</h1>
            <p>Curate your Scratch universe.</p>
        </div>
        <div class="nav-icons">
            <i class="fa-solid fa-house active"></i>
            <i class="fa-solid fa-compass"></i>
            <i class="fa-solid fa-bell"></i>
            <i class="fa-solid fa-user"></i>
        </div>
    </header>

    <main>
        <section class="compose-box">
            <div class="compose-header">
                <i class="fa-solid fa-pen-to-square"></i>
                <h3>Share a Project</h3>
            </div>
            <div class="compose-body">
                <input type="text" id="post-username" placeholder="Your Display Name" class="minimal-input">
                <input type="text" id="scratch-input" placeholder="Scratch Project URL or ID" class="minimal-input">
                <textarea id="post-caption" placeholder="Why are you sharing this? Add a caption..." class="minimal-textarea"></textarea>
            </div>
            <div class="compose-footer">
                <button onclick="submitPost()" class="post-btn"><i class="fa-solid fa-paper-plane"></i> Post to Feed</button>
            </div>
        </section>
        
        <section id="feed" class="feed">
            <!-- Feed loads here -->
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
