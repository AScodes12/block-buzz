<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLOCK BUZZ</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <h1>BLOCK BUZZ</h1>
            <p>CREATE. SHARE. PLAY. REMIX.</p>
        </div>
        <div class="nav-icons">
            <i class="fas fa-bell"></i>
            <i class="fas fa-user-circle"></i>
            <i class="fas fa-search"></i>
        </div>
    </header>

    <main>
        <section class="create-post-section">
            <h3>Share a Real Scratch Project</h3>
            <p class="sub-hint">Paste a Scratch Project URL or ID below to automatically pull its live thumbnail and stats!</p>
            <div class="input-group">
                <input type="text" id="scratch-input" placeholder="e.g., https://scratch.mit.edu/projects/769894732">
                <button onclick="submitPost()">Load & Share</button>
            </div>
        </section>
        
        <section id="feed" class="feed">
            <!-- Project feed items will load here -->
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
