<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlockBuzz - Scratch Social Hub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-brand"><i class="fa-solid fa-bolt" style="color:#0095f6;"></i> BlockBuzz</div>
        <nav class="nav-links">
            <button class="nav-link active" onclick="switchTab('home')"><i class="fa-solid fa-house"></i> Home</button>
            <button class="nav-link" onclick="switchTab('explore')"><i class="fa-solid fa-compass"></i> Explore</button>
            <button class="nav-link" onclick="switchTab('shop')"><i class="fa-solid fa-store"></i> Shop</button>
            <button class="nav-link" onclick="switchTab('account')"><i class="fa-solid fa-user"></i> Account</button>
        </nav>
        <div id="auth-container"></div>
    </header>

    <main class="main-container">
        <!-- Home Feed Section -->
        <div id="feed-section" class="tab-content">
            <div class="create-post-box">
                <h3>Share Your Own Project</h3>
                <input type="text" id="scratch-input" placeholder="Paste Scratch Project URL or ID..." class="comment-field" style="margin-bottom:8px;">
                <textarea id="post-caption" placeholder="Tell us about your project!" class="comment-field" style="height:60px; margin-bottom:8px;"></textarea>
                <button onclick="submitPost()" class="comment-submit-btn post-btn"><i class="fa-solid fa-paper-plane"></i> Post</button>
            </div>
            <div id="feed"></div>
        </div>

        <!-- Explore Section -->
        <div id="explore-section" class="tab-content" style="display:none;">
            <h2>Top Rated Projects</h2>
            <div id="explore-feed"></div>
        </div>

        <!-- Shop Section -->
        <div id="shop-section" class="tab-content" style="display:none;">
            <h2><i class="fa-solid fa-store" style="color:var(--primary-color);"></i> Banner Shop</h2>
            <div id="shop-items-container"></div>
        </div>

        <!-- Account Section -->
        <div id="account-section" class="tab-content" style="display:none;">
            <div id="account-profile-content"></div>
        </div>
    </main>

    <!-- Project Details Modal (Formatted) -->
    <div id="project-detail-modal" class="modal-backdrop">
        <div class="modal-content" style="width: 550px; max-height: 90vh; overflow-y: auto;">
            <div id="detail-modal-body"></div>
            <button onclick="closeProjectModal()" class="action-btn" style="width:100%; justify-content:center; margin-top:15px; background:#e4e6eb; padding:10px; border-radius:6px;">Close Window</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
